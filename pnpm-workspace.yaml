packages:
  - "apps/*"
  - "packages/*"

# ---------------------------------------------------------------------------
# Postinstall-script allowlist.
#
# pnpm blocks build scripts by default and FAILS the install rather than
# warning. esbuild and sharp genuinely need theirs: both fetch a platform
# binary at install time, and without it drizzle-kit, tsx and vitest are all
# broken. This is an allowlist of exactly those two, not a disable of the
# policy.
#
# The setting has been renamed across pnpm majors:
#
#   pnpm <=10  package.json -> "pnpm": { "onlyBuiltDependencies": [...] }
#   pnpm ~10.x pnpm-workspace.yaml -> onlyBuiltDependencies: [...]
#   pnpm >=11  pnpm-workspace.yaml -> allowBuilds: { pkg: true }
#
# Only the two below are needed. Render's build log confirms pnpm 11.22.0 runs
# there too: the packageManager field makes any older pnpm hand off to it. The
# package.json form was tried and removed - pnpm 11 ignores it and warns on
# every single command, which is noise that hides real warnings in a build log.
#
# `allowBuilds` is what actually decides on pnpm 11, and pnpm writes this block
# itself with the placeholder "set this to true or false". That placeholder is
# NOT approval; leaving it in place is what failed the first two deploys.
# ---------------------------------------------------------------------------

allowBuilds:
  esbuild: true
  sharp: true

onlyBuiltDependencies:
  - esbuild
  - sharp
