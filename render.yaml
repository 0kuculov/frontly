# Render Blueprint for the Frontly API.
#
# Apply with: Render dashboard -> New -> Blueprint -> point at this repo.
# The dashboard (apps/web) deploys to Vercel separately; see README.
#
# Region is Frankfurt on purpose. Phase 3 has a 1.5s end-of-speech-to-response
# budget shared between Telnyx, Azure Speech and Anthropic, and routing Balkan
# calls through a US region spends a third of it on the round trip alone.

services:
  - type: web
    name: frontly-api
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    healthCheckPath: /health

    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build

    # Migrations run before the server binds. `drizzle-kit` records what has
    # already been applied, so a restart is a no-op. Runs the compiled script
    # rather than tsx: no dev dependency is needed at runtime.
    startCommand: pnpm db:migrate:dist && pnpm start

    envVars:
      # Must agree with engines.node (">=24 <25") in the root package.json.
      # Render resolves engines.node and it wins over this value, so a
      # mismatch here is silently ignored rather than honoured — an open
      # ">=22" is what let a build pick up Node 26.
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: LOG_LEVEL
        value: info

      # --- set these in the Render dashboard (sync: false = not in git) ---
      # Turso. A file: URL is rejected at boot in production.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false

      # Public URL of this service. The media-stream URL handed to the carrier
      # is built from it, and boot fails without it in production.
      - key: PUBLIC_BASE_URL
        sync: false

      # Vercel dashboard origin(s), comma-separated, for CORS.
      - key: APP_ORIGIN
        sync: false

      # --- Phase 2+ : add as each phase lands ---
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: TELNYX_API_KEY
        sync: false
      - key: TELNYX_PHONE_NUMBER
        sync: false
      - key: TELNYX_PUBLIC_KEY
        sync: false
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        value: italynorth
      - key: AUTH_SECRET
        generateValue: true
      - key: DEMO_RESET_TOKEN
        generateValue: true

      # --- Phase 6: SMS follow-up ---------------------------------------
      # Who messages come from: an E.164 number the account owns, or an
      # alphanumeric sender ID like FRONTLY. This one variable is the switch.
      #
      # The account's only number is a US long code with
      # international_outbound: false (checked on the live account), so it can
      # reach US handsets and NOT the +389 mobiles every customer actually has.
      # Alphanumeric sender is how the Balkans receive one-way notifications
      # and needs no A2P 10DLC — that framework is US-domestic and would not
      # have helped. Set this to the approved sender ID once Telnyx enables MK.
      - key: TELNYX_SMS_FROM
        sync: false
      # Required by Telnyx whenever TELNYX_SMS_FROM is alphanumeric: there is
      # no number to look the profile up from. Boot fails if one is set
      # without the other.
      - key: TELNYX_MESSAGING_PROFILE_ID
        sync: false

  # The follow-up sweep: confirmations that did not go out, reminders due in
  # 24h, and the owner's evening summary.
  #
  # Hourly, and it decides for itself what is due. NOT scheduled at 20:00,
  # because Render's cron is UTC while the clinic runs on Europe/Skopje —
  # UTC+1 or +2 depending on the season — so a summary pinned to a UTC hour
  # would arrive at 19:00 for half the year. sendDailySummaries() checks each
  # business's own local clock instead.
  #
  # Runs the COMPILED entry point: tsx is a dev dependency and has no business
  # in a production image, the same reason startCommand uses db:migrate:dist.
  - type: cron
    name: frontly-follow-up
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    schedule: "0 * * * *"
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm follow-up:dist
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      # Every one of these must be set by hand in the dashboard: sync: false
      # means Render never copies a value across from the web service, and a
      # cron with no DATABASE_URL fails silently once an hour.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      - key: TELNYX_API_KEY
        sync: false
      - key: TELNYX_SMS_FROM
        sync: false
      - key: TELNYX_MESSAGING_PROFILE_ID
        sync: false
